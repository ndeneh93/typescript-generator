name: Add NonDex workflow for flaky test

on:
  push:
    branches:
      - fix-flaky

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Run NonDex
        run: mvn edu.illinois:nondex-maven-plugin:nondex -Dtest=YourTestClass#testMethod -DnondexRounds=10
